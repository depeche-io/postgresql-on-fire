# separated, because triples the startup time
version: "3.2"
services:
  admin:
    image: dpage/pgadmin4:8.14.0
    ports: 
      - "80:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=postgres@killercoda.sh
      - PGADMIN_DEFAULT_PASSWORD=postgres
      
    # FIXME: prefabricate config

networks:
  default:
    name: pg_default
    external: true